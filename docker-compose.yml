version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "8080:80"
    # Need to add SYS_ADMIN capability if not using privileged mode
    cap_add:
      - SYS_ADMIN

  beyla:
    image: grafana/beyla:latest
    container_name: grafana_beyla
    pid: "service:nginx" # Share PID namespace with nginx container to trace it
    privileged: true     # Required for eBPF to access kernel features
    environment:
      - BEYLA_OPEN_PORT=80
      - BEYLA_PROMETHEUS_PORT=8999
      - BEYLA_PRINT_TRACES=true # For debugging
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
    ports:
      - "8999:8999" # Expose metrics port for Prometheus
    depends_on:
      - nginx
      - tempo

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - beyla

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
      - tempo

  tempo:
    image: grafana/tempo:latest
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yaml
    ports:
      - "3200:3200"   # tempo
      - "4317:4317"   # otlp grpc
      - "4318:4318"   # otlp http
